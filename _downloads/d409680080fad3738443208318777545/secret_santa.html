<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Secret Santa Reveal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        input, button { font-size: 16px; padding: 5px; }
        #result { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Secret Santa Reveal</h2>
    <label for="keyInput">Enter your key:</label>
    <input type="text" id="keyInput" placeholder="e.g. 9c00">
    <button onclick="revealGiftee()">Reveal Giftee</button>
    <p id="result"></p>

    <script>
        // Your encrypted assignments and keys
        const assignments = {
            "9c00": "Conan",
            "c7d7": "Alice",
            "317a": "Bob"
        };

        function revealGiftee() {
            const key = document.getElementById("keyInput").value.trim();
            const result = document.getElementById("result");
            if (assignments[key]) {
                result.innerHTML = `You give a gift to: <span style="color:green">${assignments[key]}</span>`;
            } else {
                result.innerHTML = `<span style="color:red">Invalid key</span>`;
            }
        }
    </script>
</body>
</html>
